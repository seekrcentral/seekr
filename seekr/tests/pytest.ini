# pytest.ini
[pytest]
addopts = -vv
markers =
    needs_cuda: marks tests as needing CUDA to run.
    needs_openmm: marks tests as needing OpenMM to run.
    browndye: marks tests as needing Browndye2 to run.
    sda: marks tests as needing SDA to run.
    slow: marks tests as slow; skipped by default, run with --full.
    rmsd: marks tests as involving RMSD calculations; skipped by default, run with --rmsd.